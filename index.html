    body {

    canvas {

      z-index: 0;

    .overlay {

      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

    .profile-img {

      max-width: 90%;
      border-radius: 18px;
      border: 3px solid #ff0000;
      box-shadow: 0 0 20px red;
      animation: pulse 2s infinite;

    @keyframes pulse {
      0% { box-shadow: 0 0 10px red; }
      50% { box-shadow: 0 0 35px red; }
      100% { box-shadow: 0 0 10px red; }
    }

    .glitch {
      position: relative;
      margin-top: 25px;
      font-size: 3rem;
      color: white;
      text-transform: lowercase;
      animation: flicker 2s infinite;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      overflow: hidden;
    }

    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 red;
      animation: glitchTop 1s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: -2px;
      text-shadow: 2px 0 cyan;
      animation: glitchBottom 1.5s infinite linear alternate-reverse;
    }

    @keyframes glitchTop {
      0% { clip-path: inset(0 0 80% 0); }
      50% { clip-path: inset(10% 0 50% 0); }
      100% { clip-path: inset(80% 0 0 0); }
    }

    @keyframes glitchBottom {
      0% { clip-path: inset(80% 0 0 0); }
      50% { clip-path: inset(40% 0 30% 0); }
      100% { clip-path: inset(0 0 80% 0); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .typing {
      margin-top: 18px;
      font-size: 1.1rem;
      color: #cfcfcf;
      border-right: 2px solid red;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 5s steps(40,end) forwards, blink .7s infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 420px; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .terminal {
      margin-top: 35px;
      width: 90%;
      max-width: 750px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #00ff00;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      box-shadow: 0 0 25px rgba(0,255,0,0.3);
      font-family: monospace;
      color: #00ff00;
      backdrop-filter: blur(6px);
    }

    .line {
      opacity: 0;
      animation: appear 1s forwards;
    }

    .line:nth-child(1) { animation-delay: 1s; }
    .line:nth-child(2) { animation-delay: 2s; }
    .line:nth-child(3) { animation-delay: 3s; }
    .line:nth-child(4) { animation-delay: 4s; }
    .line:nth-child(5) { animation-delay: 5s; }

    @keyframes appear {
      to { opacity: 1; }
    }

    .warning {
      margin-top: 25px;
      color: red;
      font-size: 1rem;
      letter-spacing: 3px;
      animation: pulseText 1.5s infinite;
    }

    @keyframes pulseText {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .socials {
      margin-top: 20px;
      display: flex;
      gap: 18px;

    .socials a {

      justify-content: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);

    .socials a img {

      border-color: red;

    }

    .footer {

      bottom: 15px;
      color: rgba(255,255,255,0.4);

    }

    audio {

    }

    @media(max-width: 600px){

      }

        width: 100% !important;
        animation: none;
        border: none;
      }

      .terminal {

      }
    }
  </style>
</head>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%^&*';
  const fontSize = 16;
  const columns = canvas.width / fontSize;

  const drops = [];

  for(let i = 0; i < columns; i++) {
    drops[i] = 1;
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0F0';
    ctx.font = fontSize + 'px monospace';

    for(let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }

      drops[i]++;
    }
  }

  setInterval(draw, 35);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
